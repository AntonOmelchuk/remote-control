name: RemoteControlAgent

options:
  minimumXcodeGenVersion: 2.46.0
  developmentLanguage: en
  deploymentTarget:
    macOS: '15.0'
  createIntermediateGroups: true

configs:
  Debug: debug
  SignedDebug: debug
  Release: release

packages:
  RemoteCore:
    path: ../../packages/remote-core

  RemoteLink:
    path: ../../packages/remote-link
  SwiftCertificates:
    url: https://github.com/apple/swift-certificates.git
    exactVersion: 1.9.0
  SwiftCrypto:
    url: https://github.com/apple/swift-crypto.git
    exactVersion: 3.12.3
  SwiftASN1:
    url: https://github.com/apple/swift-asn1.git
    exactVersion: 1.3.1

targets:
  RemoteControlAgent:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - Info.plist
          - RemoteControlAgent.entitlements
    configFiles:
      SignedDebug: Config/Signing.xcconfig
    dependencies:
      - package: RemoteCore
      - package: RemoteLink
        product: RemotePairing
      - package: SwiftCertificates
        product: X509
      - package: SwiftCrypto
        product: Crypto
      - package: SwiftASN1
        product: SwiftASN1
    settings:
      base:
        SWIFT_VERSION: '6.0'
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: '-'
        ENABLE_HARDENED_RUNTIME: YES
        PRODUCT_NAME: RemoteControlAgent
        PRODUCT_BUNDLE_IDENTIFIER: com.antonomelchuk.remotecontrol.agent
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
      configs:
        SignedDebug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: Apple Development
          CODE_SIGN_ENTITLEMENTS: Resources/RemoteControlAgent.entitlements
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: YES

schemes:
  RemoteControlAgent:
    build:
      targets:
        RemoteControlAgent: all
    run:
      config: SignedDebug
